<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script src="./assets/js/analytics.js"></script>
  <script src="./assets/js/cookieconsent-loader.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Turkofil</title>
  <meta name="description" content="Get in touch with Turkofil — questions about lessons, bookings, or anything else.">
  <link rel="icon" href="./assets/img/logo.png" type="image/jpeg">
  <link rel="stylesheet" href="./assets/css/style.css">
<style>
  .contact-wrapper {
    max-width: 720px;
    margin: 0 auto;
    padding: 8rem 1.5rem 3rem;
  }

  .contact-header {
    text-align: center;
    margin-bottom: var(--space-8);
  }

  .contact-header h1 {
    margin: 0 0 var(--space-3) 0;
    font-size: clamp(1.6rem, 3.5vw, 2.2rem);
  }

  .contact-header p {
    margin: 0;
    color: var(--color-text-muted);
    font-size: var(--text-base, 1rem);
    line-height: 1.6;
  }

  .contact-form-wrap {
    border-radius: var(--radius-xl);
    border: 1px solid oklch(from var(--color-text) l c h / 0.08);
    box-shadow: var(--shadow-md);
    overflow: hidden;
    background: var(--color-bg-elevated, #fff);
    position: relative;
    min-height: 480px;
  }

  .contact-form-loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-3);
    color: var(--color-text-muted);
    font-size: var(--text-sm);
    background: var(--color-bg-elevated, #fff);
    transition: opacity .2s ease;
  }

  .contact-form-loading.hidden { opacity: 0; pointer-events: none; }

  .contact-spinner {
    width: 28px;
    height: 28px;
    border: 3px solid oklch(from var(--color-primary, #16a34a) l c h / 0.2);
    border-top-color: var(--color-primary, #16a34a);
    border-radius: 50%;
    animation: contactSpin 0.8s linear infinite;
  }

  @keyframes contactSpin { to { transform: rotate(360deg); } }

  #contact-form-frame {
    width: 100%;
    height: 1200px;
    border: none;
    display: block;
  }

  @media (max-width: 600px) {
    .contact-wrapper { padding: 7rem 1rem 2.5rem; }
    #contact-form-frame { height: 1400px; }
  }

  .contact-alt-note {
    text-align: center;
    margin-top: var(--space-5);
    font-size: var(--text-sm);
    color: var(--color-text-muted);
  }

  .contact-alt-note a {
    color: var(--color-primary, #16a34a);
    font-weight: 600;
    text-decoration: underline;
  }
</style>
</head>
<body>

<main class="page-wrapper">
  <div class="contact-wrapper">
    <div class="contact-header reveal">
      <h1 data-i18n="contact_title">Get in Touch</h1>
      <p data-i18n="contact_subtitle">Questions about lessons, bookings, or anything else? Send a message below and I'll get back to you as soon as possible.</p>
    </div>

    <div class="contact-form-wrap reveal">
      <div class="contact-form-loading" id="contact-form-loading">
        <div class="contact-spinner"></div>
        <span data-i18n="contact_loading">Loading form…</span>
      </div>
      <iframe
        id="contact-form-frame"
        src="https://docs.google.com/forms/d/e/1FAIpQLSfXUFxn0Tymq23dAaw528YUcH3smstGZnUzarK3AI9xjTH47w/viewform?embedded=true"
        title="Turkofil contact form">
        Loading…
      </iframe>
    </div>

    <p class="contact-alt-note" data-i18n-html="contact_alt_note">Prefer email? Reach out directly at <a href="mailto:turkofil.language@gmail.com">turkofil.language@gmail.com</a>.</p>
  </div>
</main>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const frame = document.getElementById('contact-form-frame');
    const loading = document.getElementById('contact-form-loading');
    frame.addEventListener('load', () => loading.classList.add('hidden'));
  });
</script>

<script src="./assets/js/components.js"></script>
<script src="./assets/js/i18n/common.js"></script>
<script src="./assets/js/i18n/contact.js"></script>
<script src="./assets/js/app.js"></script>
</body>
</html>
